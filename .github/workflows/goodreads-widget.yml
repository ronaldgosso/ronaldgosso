name: Update Goodreads Widget in README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-goodreads-widget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Goodreads Data and Update README
        env:
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          GOODREADS_NAME: ${{ secrets.GOODREADS_NAME }}
          GOODREADS_SHELF: 'read'
          NUM_BOOKS: '3'
        run: |
          python3 << 'PYTHON_SCRIPT'
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          import re

          user_id = os.environ.get('GOODREADS_USER_ID') or '204814205'
          name = os.environ.get('GOODREADS_NAME') or 'Ronnie'
          shelf = os.environ.get('GOODREADS_SHELF') or 'read'
          num_books = int(os.environ.get('NUM_BOOKS') or '3')

          rss_url = "https://www.goodreads.com/review/list_rss/" + user_id + "?shelf=" + shelf + "&sort=date_added&order=d"
          
          req = urllib.request.Request(rss_url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  xml_data = response.read()
          except Exception as e:
              print("Failed to fetch RSS feed:", e)
              exit(1)

          root = ET.fromstring(xml_data)
          
          books_html = ""
          for item in root.findall('.//item')[:num_books]:
              title_elem = item.find('title')
              link_elem = item.find('link')
              author_name_elem = item.find('author_name')
              image_url_elem = item.find('book_small_image_url')
              
              title = title_elem.text if title_elem is not None else 'Unknown Title'
              link = link_elem.text if link_elem is not None else '#'
              author_name = author_name_elem.text if author_name_elem is not None else 'Unknown Author'
              image_url = image_url_elem.text if image_url_elem is not None else ''

              # Clean up CDATA wrappers
              if title: title = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', title).strip()
              if author_name: author_name = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', author_name).strip()

              # GitHub-compatible HTML table row (No <style> or class attributes)
              books_html += "  <tr>\n"
              books_html += "    <td align=\"center\" width=\"80\">\n"
              books_html += "      <a href=\"" + link + "\">\n"
              books_html += "        <img src=\"" + image_url + "\" width=\"60\" alt=\"" + title + "\" />\n"
              books_html += "      </a>\n"
              books_html += "    </td>\n"
              books_html += "    <td valign=\"middle\">\n"
              books_html += "      <b><a href=\"" + link + "\">" + title + "</a></b><br/>\n"
              books_html += "      <i>by " + author_name + "</i>\n"
              books_html += "    </td>\n"
              books_html += "  </tr>\n"

          escaped_name = name.replace("'", "&#39;")
          
          # Wrap in GitHub-safe markers and table structure
          full_widget_html = (
              "<!-- GOODREADS-WIDGET:START -->\n"
              "<h3>📚 " + escaped_name + "'s Recent Reads</h3>\n"
              "<table>\n" +
              books_html +
              "</table>\n"
              "<p align=\"right\"><sub>Powered by <a href=\"https://www.goodreads.com/\">Goodreads</a></sub></p>\n"
              "<!-- GOODREADS-WIDGET:END -->"
          )

          readme_path = "README.md"
          if not os.path.exists(readme_path):
              print("Error: README.md not found!")
              exit(1)

          with open(readme_path, 'r', encoding='utf-8') as f:
              readme_content = f.read()

          start_marker = "<!-- GOODREADS-WIDGET:START -->"
          end_marker = "<!-- GOODREADS-WIDGET:END -->"

          start_idx = readme_content.find(start_marker)
          end_idx = readme_content.find(end_marker, start_idx)

          if start_idx != -1 and end_idx != -1:
              # Replace everything between (and including) the markers with the new safe HTML
              new_readme_content = (
                  readme_content[:start_idx] +
                  full_widget_html +
                  readme_content[end_idx + len(end_marker):]
              )
              
              if new_readme_content != readme_content:
                  with open(readme_path, 'w', encoding='utf-8') as f:
                      f.write(new_readme_content)
                  print("README.md updated successfully!")
              else:
                  print("No changes to README.md")
          else:
              print("Error: Markers not found in README.md")
              exit(1)
          PYTHON_SCRIPT

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update Goodreads widget in README" || exit 0
          git push
