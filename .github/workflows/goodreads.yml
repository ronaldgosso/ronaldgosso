name: Update Goodreads shelf

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate bookshelf HTML
        env:
          GOODREADS_USER_ID: "204814205"
          GOODREADS_SHELF: "read"
          GOODREADS_NUM_BOOKS: "3"
          GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}   # optional
        run: python .github/scripts/update_goodreads.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update Goodreads shelf"
          git push
